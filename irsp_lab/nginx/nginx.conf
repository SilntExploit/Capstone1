server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # Proxy API requests to the Django backend. CORS is handled by Django's
    # cors-headers middleware (an explicit origin allowlist), not here -
    # reflecting any Origin while allowing credentials is a real
    # misconfiguration, and since nginx proxies same-origin, no CORS
    # headers are actually needed for this app to function normally.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django admin to the backend.
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the login page (index.html) directly at the site root and
    # serve all other static files. No redirects. This is an
    # actively-developed training platform, so rebuilt containers should
    # always serve fresh files, never a browser-cached copy.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
